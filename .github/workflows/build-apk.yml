name: Build BeerShop POS APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew
      - run: |
          export PATH="$JAVA_HOME/bin:$PATH"
          keytool -genkey -v -keystore release.keystore -alias beershop -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=BeerShop, O=BeerShop, L=Yangon, C=MM" -noprompt
          echo "storeFile=release.keystore" > keystore.properties
          echo "storePassword=android" >> keystore.properties
          echo "keyAlias=beershop" >> keystore.properties
          echo "keyPassword=android" >> keystore.properties
          ./gradlew assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BeerShopPOS-APK
          path: app/build/outputs/apk/**/*.apk
          retention-days: 90
